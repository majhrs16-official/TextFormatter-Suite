plugins {
    id 'fabric-loom' version '1.6.12' apply false
}

group = 'me.majhrs16'
version = providers.gradleProperty('version').getOrElse('2.1.0-SNAPSHOT')

allprojects {
    group = rootProject.group
    version = rootProject.version
    apply plugin: 'java'
}

repositories {
    mavenCentral()
}

// Reproducible builds configuration
// For reproducible builds, timestamp must be deterministic:
// - SNAPSHOT: epoch (0)
// - Release: fixed timestamp from BUILD_TIMESTAMP env var (ms since epoch), or project property
allprojects {
    tasks.withType(Jar).configureEach { jar ->
        def buildTimestamp
        if (project.version.endsWith('-SNAPSHOT')) {
            buildTimestamp = 0L
        } else {
            // Allow override via environment variable or the gradle.properties entry
            // (buildTimestamp; -PbuildTimestamp=... overrides for one build).
            def envTs = System.getenv('BUILD_TIMESTAMP')
            def propTs = providers.gradleProperty('buildTimestamp').getOrNull()
            buildTimestamp = (envTs ?: propTs ?: '0') as long
            if (buildTimestamp == 0) {
                logger.warn("Release build without BUILD_TIMESTAMP env var or buildTimestamp property - using epoch (non-reproducible across builds)")
            }
        }
        jar.manifest {
            attributes(
                'Implementation-Version': project.version,
                'Implementation-Title': project.name,
                'Implementation-Vendor': 'me.majhrs16',
                'Build-Timestamp': buildTimestamp
            )
        }
        jar.setReproducibleFileOrder(true)
        jar.setPreserveFileTimestamps(false)
        jar.doLast {
            def jarFile = jar.archiveFile.get().asFile
            jarFile.setLastModified(buildTimestamp)
        }
    }
}

tasks.withType(Javadoc).configureEach {
    options.addStringOption('Xdoclint:none', '-quiet')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// Dependency locking configuration
dependencyLocking {
    lockAllConfigurations()
}

subprojects {
    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }
    
    tasks.withType(Javadoc).configureEach {
        options.addStringOption('Xdoclint:none', '-quiet')
    }
    
    // Enable dependency locking for each subproject
    dependencyLocking {
        lockAllConfigurations()
    }
}

// Architecture guard: neutral modules must not import platform SDKs or host
// internals. Adapters are allowlisted only for the SDK they adapt.
tasks.register('checkArchitecture') {
    group = 'verification'
    description = 'Fails when a neutral module imports a platform SDK or host internals'

    doLast {
        def platform = [
            'org.bukkit.', 'io.papermc.', 'com.velocitypowered.',
            'net.fabricmc.', 'net.minecraft.', 'net.dv8tion.jda.'
        ]
        def host = [
            'me.majhrs16.suite.host.', 'me.majhrs16.suite.spigothost.',
            'me.majhrs16.suite.fabrichost.'
        ]
        def neutral = [
            'core-api', 'core-render', 'kernel', 'textformatter', 'tester', 'inworld', 'messages',
            'iflow-vm', 'iflow-firewall', 'iflow-wasm', 'logger', 'transport',
            'chattranslator', 'gtranslate', 'ltranslate', 'sync-bus',
            'sync-common', 'sync-discord', 'sync-discord-jdk', 'sync-http',
            'sync-socket', 'sync-telegram', 'sync-websocket', 'sync-velocity-core',
            'observability', 'presets', 'extension-api', 'example-extension'
        ]
        def rules = [:]
        neutral.each { rules[it] = platform + host }
        // The JDA adapter may use JDA, but never host internals.
        rules['sync-discord-jda'] = host
        // The Velocity plugin may use Velocity, but never host internals.
        rules['sync-velocity'] = host

        // F4b: the platform adapters only know core-api/core-render/suite-runtime.
        // They must not import host internals, the kernel/manager, or any feature.
        def adapterForbidden = [
            'me.majhrs16.suite.host.', 'me.majhrs16.suite.kernel.',
            'me.majhrs16.suite.manager.', 'me.majhrs16.suite.textformatter.',
            'me.majhrs16.suite.tester.', 'me.majhrs16.suite.inworld.',
            'me.majhrs16.suite.messages.', 'me.majhrs16.suite.iflow.',
            'me.majhrs16.suite.chattranslator.', 'me.majhrs16.suite.gtranslate.',
            'me.majhrs16.suite.ltranslate.', 'me.majhrs16.suite.syncbus.',
            'me.majhrs16.suite.synccommon.', 'me.majhrs16.suite.syncdiscord.',
            'me.majhrs16.suite.synchttp.', 'me.majhrs16.suite.syncsocket.',
            'me.majhrs16.suite.synctelegram.', 'me.majhrs16.suite.syncwebsocket.',
            'me.majhrs16.suite.syncvelocity.', 'me.majhrs16.suite.observability.',
            'me.majhrs16.suite.presets.', 'me.majhrs16.suite.extension.'
        ]
        rules['spigot-host'] = adapterForbidden
        rules['fabric-host'] = adapterForbidden

        // F4c: platform event-capture packages may use their SDK, but never
        // host internals, the manager/kernel or a feature package.
        def syncForbidden = adapterForbidden.findAll { it != 'me.majhrs16.suite.synccommon.' }
        rules['sync-bukkit'] = syncForbidden
        rules['sync-fabric'] = syncForbidden

        def violations = []
        rules.each { module, prefixes ->
            def sourceDir = rootProject.file("src/${module}/src/main/java")
            if (!sourceDir.isDirectory()) return
            sourceDir.eachFileRecurse { file ->
                if (!file.name.endsWith('.java')) return
                file.eachLine { line, number ->
                    def trimmed = line.trim()
                    if (!trimmed.startsWith('import ')) return
                    prefixes.each { prefix ->
                        if (trimmed.startsWith("import ${prefix}")) {
                            violations << "${sourceDir.toPath().relativize(file.toPath())}:${number}: ${trimmed}"
                        }
                    }
                }
            }
        }

        // F4d: the hosts may only keep the platform invocation adapter. The
        // legacy command tree and its configuration loader must not return.
        def legacyCommandNames = [
            'CommandsConfig.java', 'CommandsConfigLoader.java', 'CommandExecutor.java'
        ]
        ['host', 'spigot-host', 'fabric-host'].each { module ->
            def sourceDir = rootProject.file("src/${module}/src/main/java")
            if (!sourceDir.isDirectory()) return
            sourceDir.eachFileRecurse { file ->
                if (!file.name.endsWith('.java')) return
                if (file.name.startsWith('DynamicCommand') ||
                        legacyCommandNames.contains(file.name)) {
                    violations << "${sourceDir.toPath().relativize(file.toPath())}: legacy host command tree must not exist"
                }
            }
        }

        if (!violations.isEmpty()) {
            throw new GradleException(
                "Architecture violations (neutral module importing platform/host or legacy host command tree):\n" +
                violations.sort().join('\n'))
        }
        println "Architecture check passed: ${rules.size()} neutral/adapter modules scanned"
    }
}

tasks.named('check') { dependsOn 'checkArchitecture' }

