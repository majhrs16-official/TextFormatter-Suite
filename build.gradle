group = 'me.majhrs16'
version = providers.gradleProperty('version').getOrElse('2.1.0-SNAPSHOT')

allprojects {
    group = rootProject.group
    version = rootProject.version
    apply plugin: 'java'
}

// Reproducible builds configuration
// For reproducible builds, timestamp must be deterministic:
// - SNAPSHOT: epoch (0)
// - Release: fixed timestamp from BUILD_TIMESTAMP env var (ms since epoch), or project property
tasks.withType(Jar).configureEach { jar ->
    def buildTimestamp
    if (project.version.endsWith('-SNAPSHOT')) {
        buildTimestamp = 0L
    } else {
        // Allow override via environment variable or the gradle.properties entry
        // (buildTimestamp; -PbuildTimestamp=... overrides for one build).
        def envTs = System.getenv('BUILD_TIMESTAMP')
        def propTs = providers.gradleProperty('buildTimestamp').getOrNull()
        buildTimestamp = (envTs ?: propTs ?: '0') as long
        if (buildTimestamp == 0) {
            logger.warn("Release build without BUILD_TIMESTAMP env var or buildTimestamp property - using epoch (non-reproducible across builds)")
        }
    }
    jar.manifest {
        attributes(
            'Implementation-Version': project.version,
            'Implementation-Title': project.name,
            'Implementation-Vendor': 'me.majhrs16',
            'Build-Timestamp': buildTimestamp
        )
    }
    jar.reproducibleFileOrder = true
    jar.doLast {
        def jarFile = jar.archiveFile.get().asFile
        jarFile.setLastModified(buildTimestamp)
    }
}

tasks.withType(Javadoc).configureEach {
    options.addStringOption('Xdoclint:none', '-quiet')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// Dependency locking configuration
dependencyLocking {
    lockAllConfigurations()
}

subprojects {
    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }
    
    tasks.withType(Javadoc).configureEach {
        options.addStringOption('Xdoclint:none', '-quiet')
    }
    
    // Enable dependency locking for each subproject
    dependencyLocking {
        lockAllConfigurations()
    }
}

// Aggregate task used by README/CI: builds every subproject, including tests.
tasks.register('buildAll') {
    description = 'Build all subprojects (includes tests)'
    group = 'build'
    dependsOn subprojects.collect { "${it.path}:build" }
}

// Aggregate Javadoc for every subproject. The root `javadoc` task alone
// only documents the root project.
tasks.register('javadocAll') {
    description = 'Generate Javadoc for every subproject'
    group = 'documentation'
    dependsOn subprojects.collect { "${it.path}:javadoc" }
}

// ============================================================
// extpush: Publish extensions to local directory (tmp/extensions/)
// ============================================================
ext {
    extensionsDir = file("tmp/extensions")
}

tasks.register('extpush') {
    description 'Publish all extension modules to local tmp/extensions directory'
    group 'publishing'
    doLast {
        extensionsDir.mkdirs()
        
        // Find extension modules (those with 'extension' in path or name)
        def extensionProjects = subprojects.findAll { it.name.contains('extension') || it.projectDir.name.contains('extension') }
        
        extensionProjects.each { project ->
            def coords = "${project.group}:${project.name}:${project.version}"
            logger.lifecycle("Publishing extension: $coords")
            
            // Copy main jar
            def jarTask = project.tasks.findByName('jar')
            if (jarTask && jarTask.outputs.files.singleFile.exists()) {
                def jarFile = jarTask.outputs.files.singleFile
                def targetName = "${project.name}-${project.version}.jar"
                copy {
                    from jarFile
                    into extensionsDir
                    rename { targetName }
                }
                logger.lifecycle("  Copied: ${extensionsDir}/${targetName}")
            }
            
            // Copy sources jar if exists (tasks with classifier 'sources')
            project.tasks.withType(Jar).findAll { it.archiveClassifier.get() == 'sources' }.each { sourcesJar ->
                if (sourcesJar.outputs.files.singleFile.exists()) {
                    def targetName = "${project.name}-${project.version}-sources.jar"
                    copy {
                        from sourcesJar.outputs.files.singleFile
                        into extensionsDir
                        rename { targetName }
                    }
                    logger.lifecycle("  Copied sources: ${extensionsDir}/${targetName}")
                }
            }
            
            // Copy javadoc jar if exists
            project.tasks.withType(Jar).findAll { it.archiveClassifier.get() == 'javadoc' }.each { javadocJar ->
                if (javadocJar.outputs.files.singleFile.exists()) {
                    def targetName = "${project.name}-${project.version}-javadoc.jar"
                    copy {
                        from javadocJar.outputs.files.singleFile
                        into extensionsDir
                        rename { targetName }
                    }
                    logger.lifecycle("  Copied javadoc: ${extensionsDir}/${targetName}")
                }
            }
        }
        
        logger.lifecycle("All extensions published to: ${extensionsDir.absolutePath}")
    }
}

// Task to clean extensions directory
tasks.register('extclean') {
    description 'Clean local extensions directory'
    group 'publishing'
    doLast {
        delete extensionsDir
        logger.lifecycle("Cleaned: ${extensionsDir.absolutePath}")
    }
}

// ============================================================
// Dependency locking tasks
// ============================================================
tasks.register('writeLocks') {
    description 'Generate dependency lockfiles for all projects (root + subprojects)'
    group 'verification'
    doLast {
        // Write locks for root project
        tasks.named('dependencies').configure {
            doLast {
                // This will write the lockfile for root
            }
        }
        tasks.named('dependencies').execute()
        
        // Write locks for each subproject
        subprojects.each { subproject ->
            try {
                logger.lifecycle("Writing locks for ${subproject.path}")
                subproject.tasks.named('dependencies').configure {
                    doLast {
                        // Lock will be written by --write-locks
                    }
                }
                subproject.tasks.named('dependencies').execute()
            } catch (e) {
                logger.warn("Could not write locks for ${subproject.path}: ${e.message}")
            }
        }
    }
}

// Helper task: check which projects have lockfiles
tasks.register('checkLocks') {
    description 'Check which projects have dependency lockfiles'
    group 'verification'
    doLast {
        def missing = []
        def present = []
        
        // Check root
        def rootLock = file("${rootDir}/gradle.lockfile")
        if (rootLock.exists()) {
            present.add(':')
        } else {
            missing.add(':')
        }
        
        allprojects.each { project ->
            // Skip root (already checked) and intermediate :src project (no build.gradle)
            if (project.path == ':' || project.path == ':src') {
                return
            }
            def lockFile = file("${project.projectDir}/gradle.lockfile")
            if (lockFile.exists()) {
                present.add(project.path)
            } else {
                missing.add(project.path)
            }
        }
        
        logger.lifecycle("Projects WITH lockfiles: ${present.size()}")
        present.each { logger.lifecycle("  ${it}") }
        logger.lifecycle("Projects WITHOUT lockfiles: ${missing.size()}")
        missing.each { logger.lifecycle("  ${it}") }
        
        if (missing.size() > 0) {
            throw new GradleException("Missing dependency lockfiles: ${missing.join(', ')}. Run './gradlew :<project>:dependencies --write-locks'.")
        }
    }
}
