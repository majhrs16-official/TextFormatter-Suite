// ============================================================
// Dependency locking tasks
// ============================================================
tasks.register('writeLocks') {
    description 'Generate dependency lockfiles for all projects (root + subprojects)'
    group 'verification'
    doLast {
        // Write locks for root project
        tasks.named('dependencies').configure {
            doLast {
                // This will write the lockfile for root
            }
        }
        tasks.named('dependencies').execute()
        
        // Write locks for each subproject
        subprojects.each { subproject ->
            try {
                logger.lifecycle("Writing locks for ${subproject.path}")
                subproject.tasks.named('dependencies').configure {
                    doLast {
                        // Lock will be written by --write-locks
                    }
                }
                subproject.tasks.named('dependencies').execute()
            } catch (e) {
                logger.warn("Could not write locks for ${subproject.path}: ${e.message}")
            }
        }
    }
}

// Helper task: check which projects have lockfiles
tasks.register('checkLocks') {
    description 'Check which projects have dependency lockfiles'
    group 'verification'
    doLast {
        def missing = []
        def present = []
        
        // Check root
        def rootLock = file("${rootDir}/gradle.lockfile")
        if (rootLock.exists()) {
            present.add(':')
        } else {
            missing.add(':')
        }
        
        allprojects.each { project ->
            // Skip root (already checked) and intermediate :src project (no build.gradle)
            if (project.path == ':' || project.path == ':src') {
                return
            }
            def lockFile = file("${project.projectDir}/gradle.lockfile")
            if (lockFile.exists()) {
                present.add(project.path)
            } else {
                missing.add(project.path)
            }
        }
        
        logger.lifecycle("Projects WITH lockfiles: ${present.size()}")
        present.each { logger.lifecycle("  ${it}") }
        logger.lifecycle("Projects WITHOUT lockfiles: ${missing.size()}")
        missing.each { logger.lifecycle("  ${it}") }
        
        if (missing.size() > 0) {
            throw new GradleException("Missing dependency lockfiles: ${missing.join(', ')}. Run './gradlew :<project>:dependencies --write-locks'.")
        }
    }
}

// ============================================================
// Test Inventory (T0) — genera docs/workdir/TEST-INVENTORY.md
// ============================================================
tasks.register('testInventory') {
    description 'Genera inventario de tests y cobertura por módulo en docs/workdir/TEST-INVENTORY.md'
    group 'verification'
    doLast {
        def reportFile = file("docs/workdir/TEST-INVENTORY.md")
        reportFile.parentFile.mkdirs()
        
        def lines = []
        lines << "# Inventario de Tests y Cobertura — ${new Date().format('yyyy-MM-dd')}"
        lines << ""
        lines << "Generado automáticamente con ./gradlew testInventory."
        lines << ""
        lines << "| Módulo | Test Dir | Archivos Test | Líneas Prod | Líneas Test | Cobertura Línea | Cobertura Rama | Gaps Críticos |"
        lines << "|---|---|---:|---:|---:|---:|---:|---|"
        
        def totalModules = 0
        def modulesWithTests = 0
        def modulesWithoutTestDir = 0
        def modulesEmptyTestDir = 0
        
        subprojects.each { project ->
            // Skip intermediate :src project (no build.gradle)
            if (project.path == ':src') return
            
            def testDir = file("${project.projectDir}/src/test")
            def testFiles = []
            def hasTestDir = testDir.exists() && testDir.isDirectory()
            
            if (hasTestDir) {
                testFiles = fileTree(testDir).include("**/*.java", "**/*.kt", "**/*.groovy", "**/*.scala").files
            }
            
            def testFileCount = testFiles.size()
            def hasEmptyTestDir = hasTestDir && testFileCount == 0
            
            if (!hasTestDir) modulesWithoutTestDir++
            else if (hasEmptyTestDir) modulesEmptyTestDir++
            else modulesWithTests++
            totalModules++
            
            // Ejecutar test y JaCoCo para este módulo si tiene tests
            def lineCoverage = "N/A"
            def branchCoverage = "N/A"
            def prodLines = "N/A"
            def testLines = "N/A"
            def gaps = []
            
            if (testFileCount > 0) {
                // Intentar obtener cobertura de reporte JaCoCo existente
                def jacocoReport = file("${project.buildDir}/reports/jacoco/test/jacocoTestReport.xml")
                if (jacocoReport.exists()) {
                    def content = jacocoReport.text
                    // Extraer cobertura global (último match de cada tipo = agregado)
                    def lineMatcher = (content =~ /<counter type="LINE" missed="(\d+)" covered="(\d+)"\/>/)
                    def branchMatcher = (content =~ /<counter type="BRANCH" missed="(\d+)" covered="(\d+)"\/>/)
                    
                    def lineMatches = []
                    while (lineMatcher.find()) {
                        lineMatches << [lineMatcher.group(1), lineMatcher.group(2)]
                    }
                    def branchMatches = []
                    while (branchMatcher.find()) {
                        branchMatches << [branchMatcher.group(1), branchMatcher.group(2)]
                    }
                    
                    if (lineMatches) {
                        def last = lineMatches[lineMatches.size() - 1]
                        try {
                            def missed = last[0] as long
                            def covered = last[1] as long
                            def total = covered + missed
                            prodLines = total
                            lineCoverage = total > 0 ? String.format(java.util.Locale.US, "%.1f%%", (covered * 100.0 / total)) : "0%"
                        } catch (e) {
                            logger.warn("Module ${project.path}: Failed to parse LINE coverage from: ${last}")
                        }
                    }
                    if (branchMatches) {
                        def last = branchMatches[branchMatches.size() - 1]
                        try {
                            def missed = last[0] as long
                            def covered = last[1] as long
                            def total = covered + missed
                            branchCoverage = total > 0 ? String.format(java.util.Locale.US, "%.1f%%", (covered * 100.0 / total)) : "0%"
                        } catch (e) {
                            logger.warn("Module ${project.path}: Failed to parse BRANCH coverage from: ${last}")
                        }
                    }
                }
                
                // Contar líneas de test aprox
                def testLineCount = 0
                testFiles.each { f ->
                    testLineCount += f.readLines().size()
                }
                testLines = testLineCount
                
                // Detectar gaps críticos
                if (testFileCount < 3) gaps << "Pocos tests (<3)"
                if (lineCoverage != "N/A" && lineCoverage.endsWith("%")) {
                    def cov = lineCoverage.replace("%", "") as double
                    if (cov < 70) gaps << "Cobertura línea <70%"
                }
                if (branchCoverage != "N/A" && branchCoverage.endsWith("%")) {
                    def cov = branchCoverage.replace("%", "") as double
                    if (cov < 50) gaps << "Cobertura rama <50%"
                }
            } else {
                gaps << "SIN TESTS"
            }
            
            def testDirStatus = !hasTestDir ? "❌ FALTA" : (hasEmptyTestDir ? "⚠️ VACÍO" : "✅ OK")
            
            lines << "| ${project.path} | ${testDirStatus} | ${testFileCount} | ${prodLines} | ${testLines} | ${lineCoverage} | ${branchCoverage} | ${gaps.join("; ")} |"
        }
        
        lines << ""
        lines << "---"
        lines << ""
        lines << "## Resumen"
        lines << ""
        lines << "- **Total módulos Java**: ${totalModules}"
        lines << "- **Con tests**: ${modulesWithTests}"
        lines << "- **Sin directorio de tests**: ${modulesWithoutTestDir}"
        lines << "- **Directorio de tests vacío**: ${modulesEmptyTestDir}"
        lines << ""
        lines << "> **Nota**: Cobertura N/A = módulo sin tests o sin reporte JaCoCo. Ejecuta ./gradlew jacocoTestReport antes para datos frescos."
        
        reportFile.write(lines.join("\n"))
        logger.lifecycle("Inventario escrito en: ${reportFile.absolutePath}")
    }
}

// ============================================================
// T2 — Gates de cobertura JaCoCo por módulo
// ============================================================
// Umbrales mínimos por módulo (baseline T1 actualizado 2026-10-24)
// - Módulos con cobertura alta: 70% línea / 50% rama (estándar)
// - Módulos con cobertura baja/incipiente: umbrales progresivos
// - Módulos SPI/API públicos: 90% línea / 80% rama (futuro T3)
subprojects { project ->
    // Skip intermediate :src project (no build.gradle)
    if (project.path == ':src') return

    // Solo configurar si el módulo tiene plugin jacoco (tarea existe tras jacocoTestReport)
    if (project.tasks.findByName('jacocoTestReport')) {
        project.tasks.named('jacocoTestReport') {
            finalizedBy 'jacocoTestCoverageVerification'
        }

        project.tasks.named('jacocoTestCoverageVerification', JacocoCoverageVerification) {
            group = 'verification'
            description = "Verifica cobertura JaCoCo contra umbrales mínimos para ${project.name}"

            // Configuración de umbrales por módulo (baseline T1)
            def thresholds = [
                // Módulos que ya superan 70/50 → estándar
                ':src:iflow-vm'       : [line: 0.70, branch: 0.50],
                ':src:kernel'         : [line: 0.70, branch: 0.50],
                ':src:logger'         : [line: 0.70, branch: 0.50],
                ':src:messages'       : [line: 0.70, branch: 0.50],
                ':src:textformatter'  : [line: 0.70, branch: 0.50],

                // Módulos con cobertura baja → progresivos (T2 objetivo: 30/15)
                ':src:host'           : [line: 0.30, branch: 0.15],
                ':src:spigot-host'    : [line: 0.15, branch: 0.10],
                ':src:transport'      : [line: 0.15, branch: 0.10],
                ':src:fabric-host'    : [line: 0.10, branch: 0.05],
                ':src:tester'         : [line: 0.10, branch: 0.05],

                // Módulos sin reporte aún → umbrales mínimos (T2 objetivo: 10/5)
                ':src:core-api'       : [line: 0.10, branch: 0.05],
                ':src:extension-api'  : [line: 0.10, branch: 0.05],
                ':src:manager-apt'    : [line: 0.10, branch: 0.05],
                ':src:manager-core'   : [line: 0.10, branch: 0.05],
                ':src:manager-spi'    : [line: 0.10, branch: 0.05],
                ':src:gtranslate'     : [line: 0.10, branch: 0.05],
                ':src:ltranslate'     : [line: 0.10, branch: 0.05],
                ':src:observability'  : [line: 0.10, branch: 0.05],
                ':src:performance'    : [line: 0.10, branch: 0.05],
                ':src:presets'        : [line: 0.10, branch: 0.05],
                ':src:sync-bus'       : [line: 0.10, branch: 0.05],
                ':src:sync-discord'   : [line: 0.10, branch: 0.05],
                ':src:sync-discord-jda': [line: 0.10, branch: 0.05],
                ':src:sync-discord-jdk': [line: 0.10, branch: 0.05],
                ':src:sync-http'      : [line: 0.10, branch: 0.05],
                ':src:sync-tcpudp'    : [line: 0.10, branch: 0.05],
                ':src:sync-telegram'  : [line: 0.10, branch: 0.05],
                ':src:sync-velocity-core': [line: 0.10, branch: 0.05],
                ':src:sync-velocity'  : [line: 0.10, branch: 0.05],
                ':src:sync-websocket' : [line: 0.10, branch: 0.05],
                ':src:loadtest'       : [line: 0.10, branch: 0.05],
                ':src:inworld'        : [line: 0.10, branch: 0.05],
                ':src:iflow-wasm'     : [line: 0.10, branch: 0.05],
                ':src:example-extension': [line: 0.10, branch: 0.05],
                ':src:common-legacy'  : [line: 0.10, branch: 0.05],
            ]

            def t = thresholds[project.path] ?: [line: 0.10, branch: 0.05]

            violationRules {
                rule {
                    limit {
                        minimum = t.line
                        counter = 'LINE'
                    }
                }
                rule {
                    limit {
                        minimum = t.branch
                        counter = 'BRANCH'
                    }
                }
            }
        }
    }
}
