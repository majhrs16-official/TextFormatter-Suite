name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      JAVA_VERSION: '21'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build all modules
        run: |
          ./gradlew :src:core-api:build \
            :src:kernel:build \
            :src:iflow:build \
            :src:host:build \
            :src:textformatter:build \
            :src:gtranslate:build \
            :src:ltranslate:build \
            :src:sync-http:build \
            :src:sync-tcpudp:build \
            :src:sync-discord:build \
            :src:sync-telegram:build \
            :src:sync-websocket:build \
            :src:sync-velocity:build \
            :src:observability:build \
            :src:extension-api:build \
            :src:example-extension:build \
            :src:manager-api:build \
            :src:manager-impl:build \
            :src:presets:build \
            :src:inworld:build \
            :src:loadtest:build \
            :src:performance:build \
            :src:transport:build \
            :src:messages:build \
            :src:tester:build \
            --no-daemon

      - name: Build Spigot plugin
        run: |
          ./gradlew :src:spigot-host:build --no-daemon

      - name: Upload Spigot artifact
        uses: actions/upload-artifact@v4
        with:
          name: textformatter-suite-spigot
          path: src/spigot-host/build/libs/*.jar
          retention-days: 7

  dependency-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Verify dependency locks
        run: |
          ./gradlew dependencies --write-locks --no-daemon
        continue-on-error: true

  web-editor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: src/web-editor/package-lock.json

      - name: Install dependencies
        working-directory: src/web-editor
        run: npm ci

      - name: Run checks
        working-directory: src/web-editor
        run: npm run check

      - name: Run integration tests
        working-directory: src/web-editor
        run: npm run test:integration

  javadoc:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Generate Javadoc
        run: ./gradlew javadoc --no-daemon

      - name: Upload Javadoc
        uses: actions/upload-artifact@v4
        with:
          name: javadoc
          path: '**/build/docs/javadoc'
          retention-days: 7