name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      JAVA_VERSION: '21'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build all modules
        run: ./gradlew build checkArchitecture --no-daemon

      - name: Verify dependency lockfiles
        run: ./gradlew checkLocks --no-daemon

      - name: Verify generated schema
        run: ./gradlew :src:host:verifySchema --no-daemon

      - name: Upload Spigot artifact
        uses: actions/upload-artifact@v4
        with:
          name: textformatter-suite-spigot
          path: src/spigot-host/build/libs/*.jar
          retention-days: 7

      - name: Upload Fabric artifact
        uses: actions/upload-artifact@v4
        with:
          name: textformatter-suite-fabric
          path: src/fabric-host/build/libs/*.jar
          retention-days: 7

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify dependency metadata
        run: ./gradlew :src:logger:compileJava --dependency-verification=strict --no-daemon

  web-editor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: src/web-editor/package-lock.json

      - name: Install dependencies
        working-directory: src/web-editor
        run: npm ci

      - name: Run checks
        working-directory: src/web-editor
        run: npm run check

      - name: Run integration tests
        working-directory: src/web-editor
        run: npm run test:integration

  javadoc:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Generate Javadoc
        run: ./gradlew javadocAll --no-daemon

      - name: Upload Javadoc
        uses: actions/upload-artifact@v4
        with:
          name: javadoc
          path: '**/build/docs/javadoc'
          retention-days: 7
