name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      JAVA_VERSION: '21'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract version from tag
        id: version
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          VERSION=${TAG#v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build all modules
        run: |
          ./gradlew :src:core-api:build :src:core-api:publishToMavenLocal \
            :src:kernel:build :src:kernel:publishToMavenLocal \
            :src:iflow:build :src:iflow:publishToMavenLocal \
            :src:host:build :src:host:publishToMavenLocal \
            :src:textformatter:build :src:textformatter:publishToMavenLocal \
            :src:gtranslate:build :src:gtranslate:publishToMavenLocal \
            :src:ltranslate:build :src:ltranslate:publishToMavenLocal \
            :src:sync-http:build :src:sync-http:publishToMavenLocal \
            :src:sync-tcpudp:build :src:sync-tcpudp:publishToMavenLocal \
            :src:sync-discord:build :src:sync-discord:publishToMavenLocal \
            :src:sync-telegram:build :src:sync-telegram:publishToMavenLocal \
            :src:sync-websocket:build :src:sync-websocket:publishToMavenLocal \
            :src:sync-velocity:build :src:sync-velocity:publishToMavenLocal \
            :src:observability:build :src:observability:publishToMavenLocal \
            :src:extension-api:build :src:extension-api:publishToMavenLocal \
            :src:example-extension:build :src:example-extension:publishToMavenLocal \
            :src:manager-api:build :src:manager-api:publishToMavenLocal \
            :src:manager-impl:build :src:manager-impl:publishToMavenLocal \
            :src:presets:build :src:presets:publishToMavenLocal \
            :src:inworld:build :src:inworld:publishToMavenLocal \
            :src:loadtest:build :src:loadtest:publishToMavenLocal \
            :src:performance:build :src:performance:publishToMavenLocal \
            :src:transport:build :src:transport:publishToMavenLocal \
            :src:messages:build :src:messages:publishToMavenLocal \
            :src:tester:build :src:tester:publishToMavenLocal \
            --no-daemon

      - name: Build Spigot plugin (fat-jar)
        run: ./gradlew :src:spigot-host:build --no-daemon

      - name: Generate SHA256 for all module JARs
        run: |
          mkdir -p release-artifacts
          # Copy all module JARs and generate SHA256
          for jar in src/*/build/libs/*.jar; do
            if [[ -f "$jar" && ! "$jar" == *-sources.jar && ! "$jar" == *-javadoc.jar ]]; then
              cp "$jar" release-artifacts/
              sha256sum "$jar" | cut -d' ' -f1 > "release-artifacts/$(basename "$jar").sha256"
            fi
          done
          # Copy Spigot fat-jar
          cp src/spigot-host/build/libs/*.jar release-artifacts/ 2>/dev/null || true
          for jar in release-artifacts/*.jar; do
            if [[ -f "$jar" && ! "$jar" == *-sources.jar && ! "$jar" == *-javadoc.jar ]]; then
              sha256sum "$jar" | cut -d' ' -f1 > "$jar.sha256"
            fi
          done

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: TextFormatter Suite ${{ steps.version.outputs.version }}
          body: |
            ## TextFormatter Suite ${{ steps.version.outputs.version }}
            
            ### Cambios
            Ver CHANGELOG.md para detalles.
            
            ### Artefactos
            - Plugin Spigot (fat-jar): `textformatter-suite-spigot-${{ steps.version.outputs.version }}.jar`
            - Módulos Java (JAR + SHA256): publicados en GitHub Releases
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            release-artifacts/*.jar
            release-artifacts/*.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}