name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      JAVA_VERSION: '21'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract version from tag
        id: version
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          VERSION=${TAG#v}
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set reproducible build timestamp
        run: |
          echo "BUILD_TIMESTAMP=$(git log -1 --format=%ct)000" >> "$GITHUB_ENV"

      - name: Build all modules and platform plugins
        run: |
          ./gradlew build checkArchitecture \
            -Pversion="${{ steps.version.outputs.version }}" \
            --no-daemon

      - name: Build reproducible module repository
        run: |
          ./gradlew moduleRepository \
            -PrepositoryBaseUrl="https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}" \
            -Pversion="${{ steps.version.outputs.version }}" \
            --no-daemon

      - name: Generate SHA256 for all host JARs
        run: |
          mkdir -p release-artifacts
          for jar in src/*/build/libs/*.jar; do
            if [[ -f "$jar" && ! "$jar" == *-sources.jar && ! "$jar" == *-javadoc.jar ]]; then
              cp "$jar" release-artifacts/
            fi
          done
          for jar in release-artifacts/*.jar; do
            sha256sum "$jar" | cut -d' ' -f1 > "$jar.sha256"
          done
          cp build/repository/*.zip build/repository/*.sha256 \
            build/repository/packages.list build/repository/SHA256SUMS \
            release-artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: TextFormatter Suite ${{ steps.version.outputs.version }}
          generate_release_notes: true
          body: |
            ## TextFormatter Suite ${{ steps.version.outputs.version }}

            ### Artefactos
            - Plugin Spigot (fat-jar): `textformatter-suite-spigot-${{ steps.version.outputs.version }}.jar`
            - Mod Fabric: `textformatter-suite-fabric-${{ steps.version.outputs.version }}.jar`
            - Paquetes de módulo reproducibles (`.zip` + `.sha256`) y `packages.list`
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            release-artifacts/*.jar
            release-artifacts/*.sha256
            release-artifacts/*.zip
            release-artifacts/packages.list
            release-artifacts/SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
