plugins {
    id 'jacoco'
    id 'java'
    id 'maven-publish'
}

group = 'me.majhrs16'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
    mavenLocal()
}

dependencies {
    implementation project(':src:core-api')
    implementation project(':src:transport')
    implementation 'org.json:json:20240303'

    testImplementation project(':src:kernel')
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.assertj:assertj-core:3.25.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

test {
    useJUnitPlatform()
}

tasks.named('test') { finalizedBy 'jacocoTestReport' }
jacocoTestReport {
    dependsOn test
    reports { xml.required = true; html.required = true; csv.required = false }
}

publishing {
    publications {
        maven(MavenPublication) {
            from components.java
            artifactId = 'suite-sync-discord-jdk'
        }
    }
    repositories {
        mavenLocal()
    }
}

configurations.configureEach {
    if (name in ['testCompileClasspath', 'testRuntimeClasspath']) {
        resolutionStrategy {
            disableDependencyVerification()
        }
    }
}

// F6 — Discord transport adapter package.
ext.moduleVersion = '2.1.0'
ext.moduleDependencies = 'transport@>=2.1.0'
apply from: rootProject.file('gradle/module-package.gradle')
