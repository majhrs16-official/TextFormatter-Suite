plugins {
    id 'fabric-loom'
    id 'java'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
    id 'jacoco'
}

group = 'me.majhrs16'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
    mavenLocal()
    maven { url 'https://maven.fabricmc.net/' }
    maven { url 'https://libraries.minecraft.net/' }
}

dependencies {
    implementation project(':src:core-api')
    implementation project(':src:core-render')
    implementation project(':src:suite-runtime')

    minecraft 'com.mojang:minecraft:1.21'
    mappings 'net.fabricmc:yarn:1.21+build.1:v2'
    modImplementation 'net.fabricmc:fabric-loader:0.16.10'
    modImplementation 'net.fabricmc.fabric-api:fabric-api:0.100.5+1.21'

    implementation 'net.kyori:adventure-api:4.17.0'
    implementation 'net.kyori:adventure-text-serializer-gson:4.17.0'

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.assertj:assertj-core:3.25.3'
    testImplementation 'org.mockito:mockito-core:5.11.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

// Fabric Loom generates local remapped mods (LoomLocalRemappedMods) whose
// checksums cannot exist in the remote verification metadata. Verification is
// therefore disabled only for this module's classpaths, not for the rest of
// the suite. The remote dependencies pulled by Loom are still locked.
configurations.configureEach {
    if (name in ['compileClasspath', 'runtimeClasspath', 'testCompileClasspath', 'testRuntimeClasspath']) {
        resolutionStrategy {
            disableDependencyVerification()
        }
    }
}

test {
    useJUnitPlatform()
}

tasks.jar {
    archiveClassifier = 'thin'
}

shadowJar {
    archiveClassifier = ''
    archiveBaseName = 'textformatter-suite-fabric'
    preserveFileTimestamps = false
    reproducibleFileOrder = true
    configurations = [project.configurations.runtimeClasspath]
}

tasks.register('verifyShadowJarHasNoFeatures') {
    dependsOn 'shadowJar'
    doLast {
        def forbidden = [
                'me/majhrs16/suite/textformatter/',
                'me/majhrs16/suite/messages/',
                'me/majhrs16/suite/chattranslator/',
                'me/majhrs16/suite/gtranslate/',
                'me/majhrs16/suite/ltranslate/',
                'me/majhrs16/suite/iflow/',
                'me/majhrs16/suite/sync',
                'me/majhrs16/suite/observability/',
                'me/majhrs16/suite/presets/',
                'me/majhrs16/suite/inworld/',
                'me/majhrs16/suite/tester/',
        ]
        def found = []
        new java.util.zip.ZipFile(tasks.named('shadowJar').get().archiveFile.get().asFile)
                .withCloseable { zip ->
                    zip.entries().each { entry ->
                        if (forbidden.any { entry.name.startsWith(it) }) {
                            found << entry.name
                        }
                    }
                }
        if (!found.isEmpty()) {
            throw new GradleException("Fabric shadow JAR contains feature classes: "
                    + found.take(10).join(', '))
        }
    }
}
tasks.named('check') { dependsOn 'verifyShadowJarHasNoFeatures' }

processResources {
    filesMatching('fabric.mod.json') {
        expand(version: project.version)
    }
}

tasks.named('test') { finalizedBy 'jacocoTestReport' }
jacocoTestReport {
    dependsOn test
    reports { xml.required = true; html.required = true; csv.required = false }
}
