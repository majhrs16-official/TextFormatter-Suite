# iFlow Rules Configuration
# Rules are evaluated in priority order (lowest priority number = highest priority)
# First matching rule wins

# Example: Drop messages containing "spam" in chat.global channel
# - id: "anti-spam"
#   priority: 100
#   target: "DROP"
#   reason: "Spam detected"
#   channel: "chat.global"
#   condition: "'spam' in #msg.texts[0]"

# Example: Skip translation for staff channel
# - id: "staff-no-translate"
