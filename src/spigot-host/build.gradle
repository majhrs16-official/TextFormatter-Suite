plugins {
    id 'jacoco'
    id 'java'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}

base {
    archivesName = 'textformatter-suite-spigot'
}

group = 'me.majhrs16'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenLocal()
    mavenCentral()
    maven { url 'https://repo.papermc.io/repository/maven-public/' }
    maven { url 'https://repo.helpch.at/releases' }
}

configurations.all {
    resolutionStrategy.cacheChangingModulesFor 0, 'seconds'
}

dependencies {
    implementation project(':src:core-api')
    implementation project(':src:core-render')
    implementation project(':src:suite-runtime')

    implementation 'net.kyori:adventure-platform-bukkit:4.3.2'
    implementation 'net.kyori:adventure-api:4.17.0'

    compileOnly 'io.papermc.paper:paper-api:1.21.4-R0.1-SNAPSHOT'
    compileOnly 'me.clip:placeholderapi:2.11.6'

    testImplementation 'io.papermc.paper:paper-api:1.21.4-R0.1-SNAPSHOT'
    testImplementation 'me.clip:placeholderapi:2.11.6'
    testImplementation project(':src:inworld')
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.assertj:assertj-core:3.24.2'
    testImplementation 'org.mockito:mockito-core:5.11.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

test {
    useJUnitPlatform()
}

tasks.jar {
    archiveClassifier = 'thin'
}

shadowJar {
    archiveClassifier = ''
    archiveBaseName = 'textformatter-suite-spigot'
    preserveFileTimestamps = false
    reproducibleFileOrder = true
    // Include only the host runtime. Feature packages are installed from
    // library/packages and must never be compiled into this artifact.
    configurations = [project.configurations.runtimeClasspath]
    dependencies {
        exclude(dependency('net.kyori:adventure-platform-bukkit'))
        exclude(dependency('net.kyori:adventure-text-minimessage'))
        exclude(dependency('net.kyori:adventure-api'))
        exclude(dependency('net.dv8tion:JDA'))
        exclude(dependency('org.yaml:snakeyaml'))
        exclude(dependency('io.papermc.paper:paper-api'))
        exclude(dependency('me.clip:placeholderapi'))
    }
    mergeServiceFiles()
}

tasks.register('verifyShadowJarHasNoFeatures') {
    dependsOn 'shadowJar'
    doLast {
        def forbidden = [
                'me/majhrs16/suite/textformatter/',
                'me/majhrs16/suite/messages/',
                'me/majhrs16/suite/chattranslator/',
                'me/majhrs16/suite/gtranslate/',
                'me/majhrs16/suite/ltranslate/',
                'me/majhrs16/suite/iflow/',
                'me/majhrs16/suite/sync',
                'me/majhrs16/suite/observability/',
                'me/majhrs16/suite/presets/',
                'me/majhrs16/suite/inworld/',
                'me/majhrs16/suite/tester/',
        ]
        def found = []
        new java.util.zip.ZipFile(tasks.named('shadowJar').get().archiveFile.get().asFile)
                .withCloseable { zip ->
                    zip.entries().each { entry ->
                        if (forbidden.any { entry.name.startsWith(it) }) {
                            found << entry.name
                        }
                    }
                }
        if (!found.isEmpty()) {
            throw new GradleException("Spigot shadow JAR contains feature classes: "
                    + found.take(10).join(', '))
        }
    }
}
tasks.named('check') { dependsOn 'verifyShadowJarHasNoFeatures' }

processResources {
    filesMatching('plugin.yml') {
        expand(version: project.version)
    }
}

tasks.named('test') { finalizedBy 'jacocoTestReport' }
jacocoTestReport {
    dependsOn test
    reports { xml.required = true; html.required = true; csv.required = false }
}