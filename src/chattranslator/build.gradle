plugins {
    id 'jacoco'
    id 'java'
    id 'maven-publish'
}

group = 'me.majhrs16'

repositories {
    mavenLocal()
    mavenCentral()
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

dependencies {
    implementation project(':src:core-api')
    implementation 'org.yaml:snakeyaml:2.2'

    testImplementation project(':src:kernel')
    // Proveedores reales para descubrir backends vía ServiceLoader
    testImplementation project(':src:gtranslate')
    testImplementation project(':src:ltranslate')
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.assertj:assertj-core:3.25.3'
    testImplementation 'org.mockito:mockito-core:5.11.0'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.11.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

test {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
    }
}

publishing {
    publications {
        maven(MavenPublication) {
            from components.java
            artifactId = 'suite-chattranslator'
        }
    }
    repositories {
        maven {
            name = 'local'
            url = rootProject.layout.buildDirectory.dir('repo').get().asFile.toURI()
        }
    }
}

// F5 — distribution ZIP for the manager
ext.moduleVersion = '2.1.0'
apply from: rootProject.file('gradle/module-package.gradle')

// Disable dependency verification for test configurations
configurations.configureEach {
    if (name in ['testCompileClasspath', 'testRuntimeClasspath']) {
        resolutionStrategy {
            disableDependencyVerification()
        }
    }
}