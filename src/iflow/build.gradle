plugins {
    id 'jacoco'
    id 'java'
    id 'maven-publish'
}

group = 'me.majhrs16'
version = '2.1.0-SNAPSHOT'

repositories {
    mavenLocal()
    mavenCentral()
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

dependencies {
    implementation project(':src:core-api')
    implementation project(':src:textformatter')
    implementation project(':src:logger')

    implementation 'net.kyori:adventure-text-minimessage:4.17.0'
    implementation 'net.kyori:adventure-text-serializer-plain:4.17.0'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.1'
    implementation 'com.fasterxml.jackson.core:jackson-annotations:2.17.1'

    testImplementation project(':src:kernel')
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

test {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
        // Show VM debug dumps on screen when built with debug enabled.
        if (project.hasProperty('logger.debug') && project.property('logger.debug').toString() == 'true') {
            showStandardStreams = true
        }
    }
}

publishing {
    publications {
        maven(MavenPublication) {
            from components.java
            artifactId = 'suite-iflow'
        }
    }
    repositories {
        maven {
            name = 'local'
            url = rootProject.layout.buildDirectory.dir('repo').get().asFile.toURI()
        }
    }
}

tasks.named('test') { finalizedBy 'jacocoTestReport' }
jacocoTestReport {
    dependsOn test
    reports { xml.required = true; html.required = true; csv.required = false }
}

jacocoTestCoverageVerification {
    violationRules { rule {
        limit { counter = 'LINE'; value = 'COVEREDRATIO'; minimum = 0.25 }
    } }
}
tasks.named('check') { dependsOn 'jacocoTestCoverageVerification' }
tasks.register('printSourceDirs') {
    doLast {
        println "Main source dirs:"
        sourceSets.main.java.srcDirs.each { println "  MAIN: " + it }
        println "Test source dirs:"
        sourceSets.test.java.srcDirs.each { println "  TEST: " + it }
    }
}

// ============================================================
// iflowAsm: assemble a .flowasm policy program with the Node CLI
// ============================================================
// The firmware ROM is ON by default: it occupies 0x0000-0x0FFF and the user
// program is placed at 0x1000. Pass -Piflow.baremetal=true to assemble a
// bare-metal program (no ROM, default origin 0x0000).
//
//   ./gradlew :src:iflow:iflowAsm
//   ./gradlew :src:iflow:iflowAsm -Piflow.source=path/to/prog.flowasm -Piflow.output=policy.flow
//   ./gradlew :src:iflow:iflowAsm -Piflow.baremetal=true -Piflow.origin=0x0000
//
// Requires Node.js 18+ and tools/iflow-compiler/node_modules (run: npm ci).

def iflowCompilerDir = rootProject.file('tools/iflow-compiler')

tasks.register('iflowCompilerBuild', Exec) {
    group = 'iflow'
    description = 'Build the TypeScript iflow assembler (npm run build).'
    workingDir iflowCompilerDir
    commandLine 'npm', 'run', 'build'
    inputs.dir(new File(iflowCompilerDir, 'src'))
    outputs.file(new File(iflowCompilerDir, 'dist/cli.js'))
}

tasks.register('iflowAsm', Exec) {
    group = 'iflow'
    description = 'Assemble a .flowasm program into a .flow binary (firmware on by default; -Piflow.baremetal=true for bare-metal).'
    dependsOn 'iflowCompilerBuild'
    workingDir iflowCompilerDir

    def source = rootProject.file(project.findProperty('iflow.source') ?: 'tools/iflow-compiler/examples/policy.flowasm')
    def output = rootProject.file(project.findProperty('iflow.output') ?: "${layout.buildDirectory.get().asFile}/iflow/policy.flow")
    def origin = project.findProperty('iflow.origin')
    def baremetal = (project.findProperty('iflow.baremetal') ?: 'false').toString().toBoolean()

    inputs.file(source)
    outputs.file(output)

    def cliArgs = ['node', 'dist/cli.js', source.path, '-o', output.path]
    if (origin) { cliArgs.addAll(['-O', origin.toString()]) }
    if (baremetal) { cliArgs.add('--no-firmware') }
    commandLine cliArgs

    doFirst { output.parentFile.mkdirs() }
}
