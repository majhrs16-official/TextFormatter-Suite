plugins {
    id 'jacoco'
    id 'java'
    id 'maven-publish'
}

evaluationDependsOn(':src:textformatter')
evaluationDependsOn(':src:messages')
evaluationDependsOn(':src:chattranslator')
evaluationDependsOn(':src:logger')
evaluationDependsOn(':src:iflow-vm')
evaluationDependsOn(':src:iflow-firewall')
evaluationDependsOn(':src:iflow-wasm')
evaluationDependsOn(':src:transport')
evaluationDependsOn(':src:gtranslate')
evaluationDependsOn(':src:ltranslate')
evaluationDependsOn(':src:sync-bus')
evaluationDependsOn(':src:sync-common')
evaluationDependsOn(':src:sync-discord')
evaluationDependsOn(':src:sync-socket')
evaluationDependsOn(':src:sync-telegram')
evaluationDependsOn(':src:sync-http')
evaluationDependsOn(':src:sync-websocket')
evaluationDependsOn(':src:observability')

group = 'me.majhrs16'

repositories {
    mavenCentral()
}

dependencies {
    implementation project(':src:core-api')
    implementation project(':src:kernel')
    implementation project(':src:manager-spi')
    implementation project(':src:manager-core')
    implementation project(':src:manager-apt')

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.assertj:assertj-core:3.25.3'
    testRuntimeOnly 'net.kyori:adventure-text-minimessage:4.17.0'
    testRuntimeOnly 'net.kyori:adventure-text-serializer-plain:4.17.0'
    testRuntimeOnly 'org.yaml:snakeyaml:2.2'
    testRuntimeOnly 'org.springframework:spring-expression:6.1.12'
    testRuntimeOnly 'com.fasterxml.jackson.core:jackson-databind:2.17.1'
    testRuntimeOnly 'com.fasterxml.jackson.core:jackson-annotations:2.17.1'
    testRuntimeOnly 'com.dylibso.chicory:runtime:1.4.0'
    testRuntimeOnly 'org.json:json:20240303'
    testRuntimeOnly 'org.java-websocket:Java-WebSocket:1.5.4'
    testRuntimeOnly 'com.google.code.gson:gson:2.10.1'
    testRuntimeOnly 'io.prometheus:simpleclient:0.16.0'
    testRuntimeOnly 'io.prometheus:simpleclient_common:0.16.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

test {
    useJUnitPlatform()
    def textformatterPackage = project(':src:textformatter').tasks.named('modulePackage')
    dependsOn textformatterPackage
    systemProperty 'textformatter.package',
            textformatterPackage.flatMap { it.archiveFile }.get().asFile.absolutePath
    def messagesPackage = project(':src:messages').tasks.named('modulePackage')
    dependsOn messagesPackage
    systemProperty 'messages.package',
            messagesPackage.flatMap { it.archiveFile }.get().asFile.absolutePath
    def chattranslatorPackage = project(':src:chattranslator').tasks.named('modulePackage')
    dependsOn chattranslatorPackage
    systemProperty 'chattranslator.package',
            chattranslatorPackage.flatMap { it.archiveFile }.get().asFile.absolutePath
    def loggerPackage = project(':src:logger').tasks.named('modulePackage')
    dependsOn loggerPackage
    systemProperty 'logger.package',
            loggerPackage.flatMap { it.archiveFile }.get().asFile.absolutePath
    def iflowVmPackage = project(':src:iflow-vm').tasks.named('modulePackage')
    dependsOn iflowVmPackage
    systemProperty 'iflow-vm.package',
            iflowVmPackage.flatMap { it.archiveFile }.get().asFile.absolutePath
    def iflowFirewallPackage = project(':src:iflow-firewall').tasks.named('modulePackage')
    dependsOn iflowFirewallPackage
    systemProperty 'iflow-firewall.package',
            iflowFirewallPackage.flatMap { it.archiveFile }.get().asFile.absolutePath
    def iflowWasmPackage = project(':src:iflow-wasm').tasks.named('modulePackage')
    dependsOn iflowWasmPackage
    systemProperty 'iflow-wasm.package',
            iflowWasmPackage.flatMap { it.archiveFile }.get().asFile.absolutePath
    def transportPackage = project(':src:transport').tasks.named('modulePackage')
    dependsOn transportPackage
    systemProperty 'transport.package',
            transportPackage.flatMap { it.archiveFile }.get().asFile.absolutePath
    def gtranslatePackage = project(':src:gtranslate').tasks.named('modulePackage')
    dependsOn gtranslatePackage
    systemProperty 'gtranslate.package',
            gtranslatePackage.flatMap { it.archiveFile }.get().asFile.absolutePath
    def ltranslatePackage = project(':src:ltranslate').tasks.named('modulePackage')
    dependsOn ltranslatePackage
    systemProperty 'ltranslate.package',
            ltranslatePackage.flatMap { it.archiveFile }.get().asFile.absolutePath
    def syncBusPackage = project(':src:sync-bus').tasks.named('modulePackage')
    dependsOn syncBusPackage
    systemProperty 'sync-bus.package',
            syncBusPackage.flatMap { it.archiveFile }.get().asFile.absolutePath
    def syncCommonPackage = project(':src:sync-common').tasks.named('modulePackage')
    dependsOn syncCommonPackage
    systemProperty 'sync-common.package',
            syncCommonPackage.flatMap { it.archiveFile }.get().asFile.absolutePath
    def syncDiscordPackage = project(':src:sync-discord').tasks.named('modulePackage')
    dependsOn syncDiscordPackage
    systemProperty 'sync-discord.package',
            syncDiscordPackage.flatMap { it.archiveFile }.get().asFile.absolutePath
    def syncSocketPackage = project(':src:sync-socket').tasks.named('modulePackage')
    dependsOn syncSocketPackage
    systemProperty 'sync-socket.package',
            syncSocketPackage.flatMap { it.archiveFile }.get().asFile.absolutePath
    def syncTelegramPackage = project(':src:sync-telegram').tasks.named('modulePackage')
    dependsOn syncTelegramPackage
    systemProperty 'sync-telegram.package',
            syncTelegramPackage.flatMap { it.archiveFile }.get().asFile.absolutePath
    def syncHttpPackage = project(':src:sync-http').tasks.named('modulePackage')
    dependsOn syncHttpPackage
    systemProperty 'sync-http.package',
            syncHttpPackage.flatMap { it.archiveFile }.get().asFile.absolutePath
    def syncWebSocketPackage = project(':src:sync-websocket').tasks.named('modulePackage')
    dependsOn syncWebSocketPackage
    systemProperty 'sync-websocket.package',
            syncWebSocketPackage.flatMap { it.archiveFile }.get().asFile.absolutePath
    def observabilityPackage = project(':src:observability').tasks.named('modulePackage')
    dependsOn observabilityPackage
    systemProperty 'observability.package',
            observabilityPackage.flatMap { it.archiveFile }.get().asFile.absolutePath
    testLogging {
        events 'passed', 'skipped', 'failed'
    }
}

publishing {
    publications {
        maven(MavenPublication) {
            from components.java
            artifactId = 'suite-runtime'
        }
    }
    repositories {
        maven {
            name = 'local'
            url = rootProject.layout.buildDirectory.dir('repo').get().asFile.toURI()
        }
    }
}

// Disable dependency verification for test configurations (AssertJ)
configurations.configureEach {
    if (name in ['testCompileClasspath', 'testRuntimeClasspath']) {
        resolutionStrategy {
            disableDependencyVerification()
        }
    }
}
