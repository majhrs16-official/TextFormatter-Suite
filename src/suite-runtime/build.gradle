plugins {
    id 'jacoco'
    id 'java'
    id 'maven-publish'
}

evaluationDependsOn(':src:textformatter')
evaluationDependsOn(':src:messages')

group = 'me.majhrs16'

repositories {
    mavenCentral()
}

dependencies {
    implementation project(':src:core-api')
    implementation project(':src:kernel')
    implementation project(':src:manager-spi')
    implementation project(':src:manager-core')
    implementation project(':src:manager-apt')

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.assertj:assertj-core:3.25.3'
    testRuntimeOnly 'net.kyori:adventure-text-minimessage:4.17.0'
    testRuntimeOnly 'net.kyori:adventure-text-serializer-plain:4.17.0'
    testRuntimeOnly 'org.yaml:snakeyaml:2.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

test {
    useJUnitPlatform()
    def textformatterPackage = project(':src:textformatter').tasks.named('modulePackage')
    dependsOn textformatterPackage
    systemProperty 'textformatter.package',
            textformatterPackage.flatMap { it.archiveFile }.get().asFile.absolutePath
    def messagesPackage = project(':src:messages').tasks.named('modulePackage')
    dependsOn messagesPackage
    systemProperty 'messages.package',
            messagesPackage.flatMap { it.archiveFile }.get().asFile.absolutePath
    testLogging {
        events 'passed', 'skipped', 'failed'
    }
}

publishing {
    publications {
        maven(MavenPublication) {
            from components.java
            artifactId = 'suite-runtime'
        }
    }
    repositories {
        maven {
            name = 'local'
            url = rootProject.layout.buildDirectory.dir('repo').get().asFile.toURI()
        }
    }
}

// Disable dependency verification for test configurations (AssertJ)
configurations.configureEach {
    if (name in ['testCompileClasspath', 'testRuntimeClasspath']) {
        resolutionStrategy {
            disableDependencyVerification()
        }
    }
}
