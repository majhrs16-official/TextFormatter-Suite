plugins {
id 'jacoco'
    id 'java'
    id 'maven-publish'
}

group = 'me.majhrs16'
description = 'iFlow WebAssembly policy engine (Chicory)'

repositories {
    mavenLocal()
    mavenCentral()
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

dependencies {
    implementation project(':src:core-api')

    // WebAssembly runtime: pure JVM, no native dependencies.
    implementation 'com.dylibso.chicory:runtime:1.4.0'

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

test {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
    }
}

publishing {
    publications {
        maven(MavenPublication) {
            from components.java
            artifactId = 'suite-iflow-wasm'
        }
    }
    repositories {
        maven {
            name = 'local'
            url = rootProject.layout.buildDirectory.dir('repo').get().asFile.toURI()
        }
    }
}

// F5 — distribution ZIP for the manager
ext.moduleVersion = '2.1.0'
apply from: rootProject.file('gradle/module-package.gradle')
