plugins {
    id 'jacoco'
    id 'java'
    id 'maven-publish'
}

group = 'me.majhrs16'
version = '2.1.0-SNAPSHOT'

repositories {
    mavenLocal()
    mavenCentral()
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

// Read debug flag from Gradle property (default: false)
ext.loggerDebug = project.hasProperty('logger.debug') ? project.property('logger.debug').toString().toLowerCase() : 'false'

// Task to replace DEBUG placeholder in source before compilation
tasks.register('replaceDebugFlag') {
    doLast {
        def debugValue = loggerDebug == 'true' ? 'true' : 'false'
        def sourceFile = file("src/main/java/me/majhrs16/suite/logger/DebugConfig.java")
        if (sourceFile.exists()) {
            def content = sourceFile.getText('UTF-8')
            // Literal replacement of the marker so escaping is never an issue.
            def replaced = content.replace('/*[[DEBUG_FLAG]]*/ false', debugValue)
            if (content != replaced) {
                sourceFile.write(replaced, 'UTF-8')
                println "Logger: Set DEBUG = $debugValue"
            } else {
                println "Logger: DEBUG placeholder not found (already set?)"
            }
        }
    }
}

// Ensure replacement happens before compilation
tasks.named('compileJava') { compileTask ->
    compileTask.dependsOn 'replaceDebugFlag'
    // Make the flag a compile input so toggling it always recompiles.
    compileTask.inputs.property('loggerDebug', loggerDebug)
    // Restore the placeholder after compilation, even when compileJava is UP-TO-DATE.
    // A finalizer runs whenever compileJava is in the task graph, unlike doLast which is
    // skipped for up-to-date tasks (that is how the placeholder could be lost before).
    compileTask.finalizedBy 'restoreDebugFlag'
}

// Restores the /*[[DEBUG_FLAG]]*/ placeholder in the tracked source so the repo stays clean.
tasks.register('restoreDebugFlag') {
    doLast {
        def sourceFile = file("src/main/java/me/majhrs16/suite/logger/DebugConfig.java")
        if (sourceFile.exists()) {
            def content = sourceFile.getText('UTF-8')
            def restored = content
                .replace('public static final boolean DEBUG = true;',
                         'public static final boolean DEBUG = /*[[DEBUG_FLAG]]*/ false;')
                .replace('public static final boolean DEBUG = false;',
                         'public static final boolean DEBUG = /*[[DEBUG_FLAG]]*/ false;')
            if (content != restored) {
                sourceFile.write(restored, 'UTF-8')
            }
        }
    }
}

dependencies {
    // No runtime dependencies - zero-overhead logger

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

test {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
    }
}

publishing {
    publications {
        maven(MavenPublication) {
            from components.java
            artifactId = 'suite-logger'
        }
    }
    repositories {
        maven {
            name = 'local'
            url = rootProject.layout.buildDirectory.dir('repo').get().asFile.toURI()
        }
    }
}

tasks.named('test') { finalizedBy 'jacocoTestReport' }
jacocoTestReport {
    dependsOn test
    reports { xml.required = true; html.required = true; csv.required = false }
}

// Anti-regression threshold (80% lines), matching :src:kernel.
jacocoTestCoverageVerification {
    violationRules { rule {
        limit { counter = 'LINE'; value = 'COVEREDRATIO'; minimum = 0.8 }
    } }
}
tasks.named('check') { dependsOn 'jacocoTestCoverageVerification' }