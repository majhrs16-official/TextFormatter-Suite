plugins {
    id 'jacoco'
    id 'java'
    id 'maven-publish'
}

group = 'me.majhrs16'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
    mavenLocal()
}

dependencies {
    implementation project(':src:core-api')

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.assertj:assertj-core:3.25.3'
    testImplementation 'org.mockito:mockito-core:5.11.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

test {
    useJUnitPlatform()
}

tasks.named('test') { finalizedBy 'jacocoTestReport' }
jacocoTestReport {
    dependsOn test
    reports { xml.required = true; html.required = true; csv.required = false }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            artifactId = 'suite-common-legacy'
        }
    }
    repositories {
        mavenLocal()
    }
}

// Disable dependency verification for test configurations (new test deps)
configurations.configureEach {
    if (name in ['testCompileClasspath', 'testRuntimeClasspath']) {
        resolutionStrategy {
            disableDependencyVerification()
        }
    }
}
