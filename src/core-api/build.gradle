plugins {
    id 'jacoco'
    id 'java'
    id 'maven-publish'
}

group = 'me.majhrs16'

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

test {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
    }
}

// Reproducible JAR configuration
tasks.withType(Jar).configureEach { jar ->
    def buildTimestamp = project.version.endsWith('-SNAPSHOT') ? 0 : 1728000000000L
    jar.manifest {
        attributes(
            'Implementation-Version': project.version,
            'Implementation-Title': project.name,
            'Implementation-Vendor': 'me.majhrs16',
            'Build-Timestamp': buildTimestamp
        )
    }
    jar.reproducibleFileOrder = true
    // Use doLast on the task to set file timestamps after JAR creation
    jar.doLast {
        def jarFile = jar.archiveFile.get().asFile
        jarFile.setLastModified(buildTimestamp)
    }
}

publishing {
    publications {
        maven(MavenPublication) {
            from components.java
            artifactId = 'suite-core-api'
        }
    }
    repositories {
        maven {
            name = 'local'
            url = rootProject.layout.buildDirectory.dir('repo').get().asFile.toURI()
        }
    }
}