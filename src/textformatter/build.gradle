plugins {
    id 'jacoco'
    id 'java'
    id 'maven-publish'
}

group = 'me.majhrs16'

repositories {
    mavenLocal()
    mavenCentral()
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

dependencies {
    implementation project(':src:core-api')
    implementation 'net.kyori:adventure-text-minimessage:4.17.0'
    implementation 'net.kyori:adventure-text-serializer-plain:4.17.0'
    implementation 'org.yaml:snakeyaml:2.2'

    testImplementation project(':src:kernel')

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

test {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
    }
}

publishing {
    publications {
        maven(MavenPublication) {
            from components.java
            artifactId = 'suite-textformatter'
        }
    }
    repositories {
        maven {
            name = 'local'
            url = rootProject.layout.buildDirectory.dir('repo').get().asFile.toURI()
        }
    }
}
// FASE T/T1 — cobertura medida (xml para CI, html para humano)
tasks.named('test') { finalizedBy 'jacocoTestReport' }
jacocoTestReport {
    dependsOn test
    reports { xml.required = true; html.required = true; csv.required = false }
}

// FASE T/T1 — umbral anti-regresión (cobertura real actual ~62%)
jacocoTestCoverageVerification {
    violationRules { rule {
        limit { counter = 'LINE'; value = 'COVEREDRATIO'; minimum = 0.60 }
    } }
}
tasks.named('check') { dependsOn 'jacocoTestCoverageVerification' }

// F5 — distribution ZIP for the manager: JAR + METADATA/package.list
def moduleVersion = '2.1.0'
def moduleJarTask = tasks.named('jar')

tasks.register('generateModuleManifest') {
    dependsOn moduleJarTask
    def jarFileProvider = moduleJarTask.flatMap { it.archiveFile }
    inputs.file(jarFileProvider)
    outputs.file(layout.buildDirectory.file('module/METADATA/package.list'))
    doLast {
        def jarFile = jarFileProvider.get().asFile
        def bytes = jarFile.bytes
        def digest = java.security.MessageDigest.getInstance('SHA-256').digest(bytes)
        def sha = digest.collect { String.format('%02x', it & 0xff) }.join()
        def manifest = """Name: textformatter
Version: ${moduleVersion}
Channel: stable
Type: PACKAGE
Dependencies: 
Arch: none
Platform: common
URL: 
OS: none
SHA256: 
Size: 0
Files: 
  manager/library/packages/textformatter.jar\t${bytes.length}\t${sha}\ttextformatter
"""
        def out = layout.buildDirectory.file('module/METADATA/package.list').get().asFile
        out.parentFile.mkdirs()
        out.text = manifest
    }
}

tasks.register('modulePackage', Zip) {
    dependsOn 'generateModuleManifest'
    archiveFileName = "textformatter-${moduleVersion}.zip"
    destinationDirectory = layout.buildDirectory.dir('distributions')
    from(layout.buildDirectory.dir('module'))
    from(moduleJarTask.flatMap { it.archiveFile }) {
        into 'manager/library/packages'
        rename { 'textformatter.jar' }
    }
}

