plugins {
    id 'jacoco'
    id 'java'
    id 'maven-publish'
}

group = 'me.majhrs16'
description = 'iFlow firewall legacy: motor de reglas SpEL restaurado desde 933bdd3^, alternativa mutuamente excluyente a iflow-vm'

repositories {
    mavenLocal()
    mavenCentral()
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

dependencies {
    implementation project(':src:core-api')
    testImplementation project(':src:textformatter')
    implementation 'net.kyori:adventure-text-minimessage:4.17.0'
    implementation 'net.kyori:adventure-text-serializer-plain:4.17.0'
    implementation 'org.springframework:spring-expression:6.1.12'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.1'
    implementation 'com.fasterxml.jackson.core:jackson-annotations:2.17.1'
    implementation 'org.yaml:snakeyaml:2.2'

    testImplementation project(':src:kernel')
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

test {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
    }
}

publishing {
    publications {
        maven(MavenPublication) {
            from components.java
            artifactId = 'suite-iflow-firewall'
        }
    }
    repositories {
        maven {
            name = 'local'
            url = rootProject.layout.buildDirectory.dir('repo').get().asFile.toURI()
        }
    }
}

tasks.named('test') { finalizedBy 'jacocoTestReport' }
jacocoTestReport {
    dependsOn test
    reports { xml.required = true; html.required = true; csv.required = false }
}

jacocoTestCoverageVerification {
    violationRules { rule {
        limit { counter = 'LINE'; value = 'COVEREDRATIO'; minimum = 0.55 }
    } }
}
tasks.named('check') { dependsOn 'jacocoTestCoverageVerification' }

// F5 — distribution ZIP for the manager
ext.moduleVersion = '2.1.0'
apply from: rootProject.file('gradle/module-package.gradle')
