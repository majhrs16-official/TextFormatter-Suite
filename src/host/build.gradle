plugins {
    id 'jacoco'
    id 'java'
    id 'maven-publish'
}

group = 'me.majhrs16'
version = '2.1.0-SNAPSHOT'

repositories {
    mavenLocal()
    mavenCentral()
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

dependencies {
    implementation project(':src:core-api')
    implementation project(':src:textformatter')
    implementation project(':src:iflow')
    implementation project(':src:transport')
    implementation 'net.kyori:adventure-text-minimessage:4.17.0'
    implementation 'net.kyori:adventure-text-serializer-plain:4.17.0'
    implementation 'org.yaml:snakeyaml:2.2'

    implementation project(':src:kernel')

    // For ConfigSchemaGenerator
    implementation 'com.google.code.gson:gson:2.11.0'

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // Translators for testing via ServiceLoader
    testImplementation project(':src:gtranslate')
    testImplementation project(':src:ltranslate')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

test {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
    }
}

publishing {
    publications {
        maven(MavenPublication) {
            from components.java
            artifactId = 'suite-host'
        }
    }
    repositories {
        maven {
            name = 'local'
            url = rootProject.layout.buildDirectory.dir('repo').get().asFile.toURI()
        }
    }
}
// FASE T/T1 — cobertura medida (xml para CI, html para humano)
tasks.named('test') { finalizedBy 'jacocoTestReport' }
jacocoTestReport {
    dependsOn test
    reports { xml.required = true; html.required = true; csv.required = false }
}

// FASE T/T1 — umbral anti-regresión (85% líneas)
jacocoTestCoverageVerification {
    violationRules { rule {
        limit { counter = 'LINE'; value = 'COVEREDRATIO'; minimum = 0.29 }
    } }
}
tasks.named('check') { dependsOn 'jacocoTestCoverageVerification' }

// Generate schema files for web editor (paths.json, schema-v2.2.md)
tasks.register('generateSchema', JavaExec) {
    group = 'build'
    description = 'Generate web editor schema files from ConfigPath enum'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'me.majhrs16.suite.host.config.ConfigSchemaGenerator'
    args = [rootProject.layout.buildDirectory.dir('generated-schema').get().asFile.absolutePath]
    doFirst {
        // Ensure output directory exists
        rootProject.layout.buildDirectory.dir('generated-schema').get().asFile.mkdirs()
    }
    doLast {
        // Copy generated files to web-editor
        def srcDir = rootProject.layout.buildDirectory.dir('generated-schema').get().asFile
        def destDir = file('src/main/resources/web-editor-schema')
        copy {
            from srcDir
            into destDir
        }
    }
}

// Also add a task to verify schema is up-to-date
tasks.register('verifySchema', JavaExec) {
    group = 'verification'
    description = 'Verify generated schema matches web-editor'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'me.majhrs16.suite.host.config.ConfigSchemaGenerator'
    args = [rootProject.layout.buildDirectory.dir('generated-schema-verify').get().asFile.absolutePath]
    doFirst {
        rootProject.layout.buildDirectory.dir('generated-schema-verify').get().asFile.mkdirs()
    }
    doLast {
        def generated = file(rootProject.layout.buildDirectory.dir('generated-schema-verify').get().asFile.absolutePath + '/paths.json')
        def existing = file('src/main/resources/web-editor-schema/paths.json')
        if (!generated.text.equals(existing.text)) {
            throw new GradleException('Schema out of date! Run :src:host:generateSchema to update.')
        }
    }
}
