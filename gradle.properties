# ============================================================================
# Configuración del build de textformatter-suite
# ----------------------------------------------------------------------------
# Gradle lee este archivo automáticamente. Cada opción se documenta aquí para
# que sea fácil de encontrar; cualquier valor puede sobrescribirse puntualmente
# desde la línea de comandos con  -P<clave>=<valor>  sin tocar el archivo.
#
# Los nombres llevan prefijo con punto (namespace) y se irán acumulando aquí a
# medida que el proyecto los necesite. No añadas aquí opciones efímeras de un
# build concreto: usa  -P  para eso.
# ============================================================================

# ---------------------------------------------------------------------------
# Logger  (módulo src/logger)
# ---------------------------------------------------------------------------
# Inyecta DEBUG=true en DebugConfig.java al compilar. Con false (por defecto) el
# logger compila sin trazas y el JIT elimina los bloques if (DebugConfig.DEBUG).
# Cuando está activo, :src:iflow:test muestra stdout/stderr (dumps de la VM).
logger.debug=false

# ---------------------------------------------------------------------------
# Toolchain iFlow  (tarea :src:iflow:iflowAsm)
# ---------------------------------------------------------------------------
# Programa .flowasm de entrada, relativo a la raíz del proyecto.
# Default: tools/iflow-compiler/examples/policy.flowasm
# iflow.source=

# Binario .flow de salida.
# Default: <buildDir>/iflow/policy.flow
# iflow.output=

# Origin de ensamblado en hexadecimal (p. ej. 0x0000). Por defecto lo decide el
# modo: con firmware ON la ROM ocupa 0x0000 y el código va en 0x1000; en
# bare-metal el código va en 0x0000.
# iflow.origin=

# Ensambla bare-metal: sin ROM de firmware y origin 0x0000.
iflow.baremetal=false

# ---------------------------------------------------------------------------
# Build reproducible  (tareas Jar)
# ---------------------------------------------------------------------------
# Timestamp en milisegundos desde epoch para releases reproducibles. Las
# versiones -SNAPSHOT usan siempre 0; los releases sin valor usan epoch 0 y
# emiten un aviso.
# buildTimestamp=
