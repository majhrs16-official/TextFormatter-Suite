# ChatTranslator rules (native replacement for ConditionalEvents).
#
# Every rule guards a set of events with SpEL conditions; when ALL conditions
# hold, the actions run against a ScriptSurface bound to each message.
#
# Available atomic operations on the surface (use `msg` in expressions):
#   reads:    sender(), type(), text(), texts(), text(i), size(), langSource(),
#             langTarget(), colorMode(), isCancelled(), isShown(), formatPapi(),
#             lastFormatPath(), id()
#   writes:   setType(), setText(s), setLangSource(), setLangTarget(),
#             setColorMode(), setFormatPapi(), show(), hide(), cancel(),
#             skipTranslate(), setFormat('group.path')
#   helpers:  clone(), toJson()
# Sender access: sender().name(), sender().uuid(), sender().kind(), sender().isPlayer()
#
# Example (rank-colored formats by prefix, equivalent to the old CE config):
rules:
  default_chat:
    events: [CHAT, SIGN]
    conditions:
      - "sender().kind().name() == 'PLAYER'"
    actions:
      - "setFormat('remitente_user')"

  private_chat:
    events: [PRIVATE, MENTION]
    conditions:
      - "sender().kind().name() == 'PLAYER'"
    actions:
      - "setFormat('todo_privado')"