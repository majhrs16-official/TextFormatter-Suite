plugins {
    id 'jacoco'
    id 'java'
    id 'maven-publish'
}

group = 'me.majhrs16'
version = '2.1.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenLocal()
    mavenCentral()
    maven { url 'https://hub.spigotmc.org/nexus/content/repositories/snapshots/' }
}

dependencies {
    implementation 'me.majhrs16:suite-core-api:2.1.0-SNAPSHOT'
    implementation 'me.majhrs16:suite-kernel:2.1.0-SNAPSHOT'
    implementation 'me.majhrs16:suite-host:2.1.0-SNAPSHOT'
    implementation 'me.majhrs16:suite-textformatter:2.1.0-SNAPSHOT'
    implementation 'me.majhrs16:suite-iflow:2.1.0-SNAPSHOT'
    implementation 'me.majhrs16:suite-messages:2.1.0-SNAPSHOT'
    implementation 'net.kyori:adventure-api:4.17.0'

    // Spigot API for runtime (needed for Bukkit types in main source)
    implementation 'org.spigotmc:spigot-api:1.16.5-R0.1-SNAPSHOT'

    // Test dependencies - need full suite for integration tests
    testImplementation 'me.majhrs16:suite-gtranslate:2.1.0-SNAPSHOT'
    testImplementation 'me.majhrs16:suite-ltranslate:2.1.0-SNAPSHOT'
    testImplementation 'me.majhrs16:suite-sync-discord:2.1.0-SNAPSHOT'
    testImplementation 'me.majhrs16:suite-sync-http:2.1.0-SNAPSHOT'
    testImplementation 'me.majhrs16:suite-sync-tcpudp:2.1.0-SNAPSHOT'
    testImplementation 'me.majhrs16:suite-sync-telegram:2.1.0-SNAPSHOT'
    testImplementation 'me.majhrs16:suite-transport:2.1.0-SNAPSHOT'

    // For Spigot integration tests
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.mockito:mockito-core:5.11.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

test {
    useJUnitPlatform()
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            artifactId = 'suite-tester'
        }
    }
    repositories {
        mavenLocal()
    }
}

tasks.named('test') { finalizedBy 'jacocoTestReport' }
jacocoTestReport {
    dependsOn test
    reports { xml.required = true; html.required = true; csv.required = false }
}