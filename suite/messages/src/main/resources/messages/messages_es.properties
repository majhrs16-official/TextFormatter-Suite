# TextFormatter Suite - Mensajes integrados (Español)
# Catálogo centralizado para todos los hosts de plataforma (Spigot, Fabric, etc.)

prefix=[suite] 
not-initialized=[suite] no inicializado
usage=[suite] uso: /suite <lang|reload|status|toggle|reset>
enabled=[suite] activo: {} canales, traductor '{}'
reload-ok=[suite] recargado: {} canales, traductor '{}'
reload-error=[suite] error al recargar: {}
status.channels=[suite] canales: {}
status.translator=[suite] traductor activo: {}
status.knobs=[suite] engine.parallel: {} · sonido: {} · claim: {}
lang.current=[suite] tu idioma: {}
lang.updated=[suite] idioma actualizado: {}
lang.invalid=[suite] valor inválido: usa auto | off | <código> (ej. es, en, zh-CN)
lang.other-admin=[suite] setear el idioma de otro requiere admin
lang.player-offline=[suite] jugador no conectado: {}
lang.console=[suite] consola no tiene idioma; usa /suite lang <jugador> <valor>
toggle.current=[suite] traducción: {}
reset.ok=[suite] configs restauradas (respaldo en backup/); storage.yml intacto
reset.error=[suite] error al restaurar: {}
